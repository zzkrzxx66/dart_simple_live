name: Build My TV ARMv7 APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: simple_live_tv_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TV_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/tv-release.jks
          printf 'storeFile=tv-release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - name: Restore packages
        run: flutter pub get
      - name: Build ARMv7 TV APK
        run: flutter build apk --release --target-platform android-arm
      - name: Verify APK signature
        run: |
          SDK_BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Live-TV-ARMv7-APK
          path: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
